
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMELAND Logistics Smart ERP</title>
<style>
:root{--navy:#10243a;--blue:#1769aa;--bg:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172b40}
header{background:var(--navy);color:white;padding:20px}
header h2{margin:0 0 7px}
nav{display:flex;gap:7px;flex-wrap:wrap;background:#fff;padding:12px}
button{border:0;border-radius:6px;padding:11px 14px;background:var(--blue);color:white;cursor:pointer}
nav button{background:#e5edf5;color:#123}
nav button.active{background:var(--blue);color:white}
main{padding:15px;max-width:1200px;margin:auto}
.panel{background:white;padding:17px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.stat{background:#eaf3fc;padding:18px;border-radius:9px}
.stat strong{display:block;font-size:25px;margin-top:8px;color:#1769aa}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:6px;margin:6px 0 12px;font-size:15px}
label{font-weight:bold;font-size:13px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}
th{background:var(--navy);color:white}
.tablewrap{overflow-x:auto}
.actions{display:flex;gap:5px}
.del{background:#dc3545}
.edit{background:#198754}
.hidden{display:none}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>
<header>
<h2>HOMELAND LOGISTICS</h2>
SMART ERP MANAGEMENT SYSTEM
<p>Moving the world. Moving your business.</p>
</header>

<nav id="nav">
<button class="active" onclick="show('Dashboard',this)">Dashboard</button>
<button onclick="show('Customers',this)">Customers</button>
<button onclick="show('Employees',this)">Employees</button>
<button onclick="show('Vehicles',this)">Vehicles</button>
<button onclick="show('Deliveries',this)">Deliveries</button>
<button onclick="show('Finance',this)">Finance</button>
<button onclick="show('Settings',this)">Settings</button>
</nav>

<main>
<section id="Dashboard" class="page">
<div class="panel"><h2>Company Dashboard</h2>
<div class="cards">
<div class="stat">Customers<strong id="sCustomers">0</strong></div>
<div class="stat">Employees<strong id="sEmployees">0</strong></div>
<div class="stat">Vehicles<strong id="sVehicles">0</strong></div>
<div class="stat">Deliveries<strong id="sDeliveries">0</strong></div>
<div class="stat">Total Income<strong id="sIncome">0</strong></div>
<div class="stat">Total Expense<strong id="sExpense">0</strong></div>
</div></div>
<div class="panel"><h3>Financial Balance</h3>
<h2 id="balance">0 SAR</h2>
<p>Income minus Expense</p></div>
</section>

<div id="workspace"></div>
</main>
<footer>© 2026 HOMELAND LOGISTICS SERVICE COMPANY</footer>

<script>
const modules={
Customers:['Customer Name','Phone','Company','Address'],
Employees:['Employee Name','Phone','Role','Join Date'],
Vehicles:['Vehicle Number','Vehicle Type','Driver','Status'],
Deliveries:['Delivery Date','From','To','Customer','Status'],
Finance:['Date','Type','Amount','Description']
};

let data={};
Object.keys(modules).forEach(k=>{
try{data[k]=JSON.parse(localStorage.getItem('home_'+k))||[]}
catch(e){data[k]=[]}
});

let current='',editing=-1;

function save(k){
localStorage.setItem('home_'+k,JSON.stringify(data[k]));
}

function show(page,btn){
document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
document.getElementById('workspace').innerHTML='';
document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
if(btn)btn.classList.add('active');

if(page==='Dashboard'){
document.getElementById('Dashboard').classList.remove('hidden');
dashboard();
return;
}
if(page==='Settings'){settings();return}
current=page;
editing=-1;
render();
}

function dashboard(){
['Customers','Employees','Vehicles','Deliveries'].forEach(k=>{
document.getElementById('s'+k).textContent=data[k].length;
});
let income=0,expense=0;
data.Finance.forEach(x=>{
if(x.Type==='Income')income+=Number(x.Amount)||0;
else expense+=Number(x.Amount)||0;
});
document.getElementById('sIncome').textContent=income.toFixed(2);
document.getElementById('sExpense').textContent=expense.toFixed(2);
document.getElementById('balance').textContent=(income-expense).toFixed(2)+' SAR';
}

function render(){
let fields=modules[current];
let html='<div class="panel"><h2>'+current+' Management</h2>';
html+='<form onsubmit="add(event)"><div class="formgrid">';
fields.forEach(f=>{
html+='<div><label>'+f+'</label>';
if(f==='Type')html+='<select id="f'+f+'" required><option>Income</option><option>Expense</option></select>';
else if(f==='Status')html+='<select id="f'+f+'"><option>Pending</option><option>In Progress</option><option>Completed</option><option>Available</option><option>Active</option></select>';
else html+='<input id="f'+f+'" '+(f==='Amount'?'type="number" step="0.01"':'')+' placeholder="Enter '+f+'" required>';
html+='</div>';
});
html+='</div><button type="submit">'+(editing>=0?'Update Record':'Save Record')+'</button> <button type="button" onclick="cancelEdit()" style="background:#64748b">Clear</button></form></div>';
html+='<div class="panel"><h3>All '+current+'</h3>';
html+='<input id="search" placeholder="Search records..." oninput="filterRows()">';
html+='<button onclick="exportCSV()">Export Excel CSV</button> <button onclick="window.print()">Print / PDF</button>';
html+='<div class="tablewrap"><table id="records"><thead><tr>';
fields.forEach(f=>html+='<th>'+f+'</th>');
html+='<th>Actions</th></tr></thead><tbody>';
data[current].forEach((r,i)=>html+=row(r,i));
html+='</tbody></table></div></div>';
document.getElementById('workspace').innerHTML=html;
}

function row(r,i){
let html='<tr>';
modules[current].forEach(f=>html+='<td>'+escapeHTML(r[f]??'')+'</td>');
html+='<td><div class="actions"><button class="edit" onclick="editRow('+i+')">Edit</button><button class="del" onclick="deleteRow('+i+')">Delete</button></div></td></tr>';
return html;
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function add(e){
e.preventDefault();
let obj={};
modules[current].forEach(f=>obj[f]=document.getElementById('f'+f).value.trim());
if(editing>=0)data[current][editing]=obj;
else data[current].push(obj);
save(current);
editing=-1;
render();
dashboard();
}

function editRow(i){
editing=i;
render();
modules[current].forEach(f=>{
document.getElementById('f'+f).value=data[current][i][f]||'';
});
document.querySelector('form').scrollIntoView({behavior:'smooth'});
}

function deleteRow(i){
if(confirm('Delete this record?')){
data[current].splice(i,1);
save(current);
render();
dashboard();
}
}

function cancelEdit(){
editing=-1;
render();
}

function filterRows(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('#records tbody tr').forEach(tr=>{
tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none';
});
}

function exportCSV(){
let fields=modules[current];
let rows=[fields,...data[current].map(r=>fields.map(f=>r[f]||''))];
let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
let blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=current+'_Report.csv';
a.click();
URL.revokeObjectURL(a.href);
}

function settings(){
document.getElementById('workspace').innerHTML=`
<div class="panel"><h2>Company Settings</h2>
<label>Company Name</label><input id="company" value="${escapeHTML(localStorage.getItem('companyName')||'HOMELAND LOGISTICS SERVICE COMPANY')}">
<label>Mobile / WhatsApp</label><input id="phone" value="${escapeHTML(localStorage.getItem('companyPhone')||'+8801861969040')}">
<label>Email</label><input id="email" value="${escapeHTML(localStorage.getItem('companyEmail')||'amtexbd778@gmail.com')}">
<button onclick="saveSettings()">Save Settings</button>
</div>
<div class="panel"><h3>Data Management</h3>
<p>Export individual module data using the CSV button in each section.</p>
<button class="del" onclick="clearAll()">Delete All Records</button>
</div>`;
}

function saveSettings(){
['company','phone','email'].forEach(id=>{
localStorage.setItem(
{id:'',company:'companyName',phone:'companyPhone',email:'companyEmail'}[id],
document.getElementById(id).value
);
});
alert('Settings saved');
}

function clearAll(){
if(confirm('Are you sure? All ERP records will be deleted.')){
Object.keys(data).forEach(k=>{data[k]=[];save(k)});
dashboard();
alert('Records cleared');
}
}

dashboard();
</script>
</body>
</html>
